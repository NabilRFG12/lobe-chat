name: lobehub

services:
  lobe:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        FEATURE_FLAGS: ${FEATURE_FLAGS:-}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        NEXT_PUBLIC_ANALYTICS_POSTHOG: ${NEXT_PUBLIC_ANALYTICS_POSTHOG:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_ANALYTICS_UMAMI: ${NEXT_PUBLIC_ANALYTICS_UMAMI:-}
        NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      APP_URL: ${APP_URL}
      INTERNAL_APP_URL: ${INTERNAL_APP_URL:-http://localhost:3210}
      KEY_VAULTS_SECRET: ${KEY_VAULTS_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-${APP_URL}}
      JWKS_KEY: ${JWKS_KEY}
      DATABASE_DRIVER: node
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgresql:5432/${LOBE_DB_NAME}
      REDIS_URL: redis://redis:6379
      REDIS_PREFIX: lobechat
      REDIS_TLS: 0
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${RUSTFS_LOBE_BUCKET}
      S3_ENABLE_PATH_STYLE: 1
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      S3_SET_ACL: 0
      LLM_VISION_IMAGE_USE_BASE64: 1
      SEARXNG_URL: http://searxng:8080
    expose:
      - "3210"
    restart: unless-stopped
    networks:
      - lobe-network

  postgresql:
    image: paradedb/paradedb:latest-pg17
    environment:
      POSTGRES_DB: ${LOBE_DB_NAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lobe-network

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1000 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - lobe-network

  rustfs:
    image: rustfs/rustfs:latest
    command: ["--access-key", "${RUSTFS_ACCESS_KEY}", "--secret-key", "${RUSTFS_SECRET_KEY}", "/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - rustfs_data:/data
    networks:
      - lobe-network

  rustfs-init:
    image: minio/mc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: /bin/sh
    command: |
      -c '
        set -eu
        POLICY='\''{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::'\''"$${RUSTFS_LOBE_BUCKET}"'\''/*"]}]}'\''
        printf "%s\n" "$${POLICY}" > /tmp/bucket-policy.json
        mc alias set rustfs "http://rustfs:9000" "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}"
        mc mb "rustfs/$${RUSTFS_LOBE_BUCKET}" --ignore-existing
        mc anonymous set-json /tmp/bucket-policy.json "rustfs/$${RUSTFS_LOBE_BUCKET}"
      '
    restart: "no"
    networks:
      - lobe-network

  searxng:
    image: searxng/searxng:latest
    environment:
      BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080/}
      INSTANCE_NAME: ${SEARXNG_INSTANCE_NAME:-nabiler-lobehub}
      SEARXNG_SETTINGS_FILE: /etc/searxng/settings.yml
    expose:
      - "8080"
    volumes:
      - ../deploy/searxng-settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    networks:
      - lobe-network

networks:
  lobe-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
